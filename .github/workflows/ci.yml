name: ci
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter secondparty build
      - run: pnpm --filter secondparty test:types
      - run: pnpm --filter secondparty test
      - run: pnpm --filter rr-node build
      - run: pnpm --filter rr-workers build
      - run: SP_SKIP_FIXTURE_BUILD=1 pnpm test:integration
